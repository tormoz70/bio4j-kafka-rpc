        - "kafka-rpc-spring-boot-starter/src/test/java/ru/sbrf/uamc/kafkarpc/spring/KafkaRpcChannelPoolTest.java"
        - "kafka-rpc-spring-boot-starter/src/test/java/ru/sbrf/uamc/kafkarpc/spring/KafkaRpcChannelPoolAutoConfigurationTest.java"
        - "kafka-rpc-spring-boot-starter/src/test/java/ru/sbrf/uamc/kafkarpc/spring/KafkaRpcServerAutoConfigurationTest.java"
    - domain: "example smoke (внешний репозиторий)"
