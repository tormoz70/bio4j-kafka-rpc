# ==============================================================================
# 5. ПАТТЕРНЫ ВЗАИМОДЕЙСТВИЯ (FEW-SHOT)
# ==============================================================================
examples:
  - scenario: "Пользователь просит добавить client-streaming / bidi."
    agent_thought: >
      Это явно вне scope. Нужен отдельный RFC, изменение wire-протокола и MAJOR.
      Нельзя «быстро» прикрутить поверх текущего StreamSink.
    agent_action: >
      Отказать в реализации в текущем релизе; сослаться на domain_knowledge.rpc_types.not_supported
      и предложить RFC + версионирование.

  - scenario: "Пользователь просит серверу задать reply-topic в application.yml."
    agent_thought: >
      Контракт: reply-topic всегда из заголовка клиентского запроса.
      Серверный конфиг — только request-topic (+ producer/consumer overrides).
    agent_action: >
      Объяснить инвариант; указать KafkaRpcServer и docs/application-yml-configuration.md;
      не добавлять server.reply-topic.

  - scenario: "Пользователь чинит CommitFailedException / потерю оффсетов."
    agent_thought: >
      Классические баги: clear() до успешного commit; race forEach+clear;
      отсутствие финального flush после awaitTermination в stop().
    agent_action: >
      Читать KafkaRpcServer.flushPendingCommits / stop; править по guardrails.concurrency;
      добавить/обновить тесты; свериться с docs/qwen-review-20260803.txt.

  - scenario: "Пользователь видит ORPHAN_REPLY в логах."
    agent_thought: >
      Несколько pooled-каналов (разные group.id) читают один reply-topic;
      ответ обрабатывает только канал с pending[cid], остальные — orphan.
    agent_action: >
      Не чинить «бага» в диспатче; рекомендовать один канал или отдельный reply-topic
      (docs/client-channel-topology-and-consumer-groups.md).

  - scenario: "Пользователь просит oneway RPC."
    agent_thought: >
      Codegen: returns google.protobuf.Empty → channel.send, без ожидания ответа.
    agent_action: >
      Предложить proto с Empty; не изобретать отдельную аннотацию/option без нужды;
      сослаться на KafkaRpcGenerator.isOneway.

  - scenario: "Пользователь жалуется на утечку стримов / зависание после close."
    agent_thought: >
      Проверить инициализацию streamLastActivity в startStream, cleanupStaleEntries
      (в т.ч. orphan activity без streamQueues), закрытие StreamingCall,
      cancel на idle timeout, поведение close() канала.
    agent_action: >
      Читать PooledKafkaRpcChannel + StreamingCallImpl + StreamSinkImpl; чинить lifecycle,
      не увеличивать таймауты «вслепую».

# ==============================================================================
# 6. ОБРАБОТКА ОШИБОК И ЭСКАЛАЦИЯ
# ==============================================================================
error_handling:
  - "Если запрос ломает wire-протокол без MAJOR — укажи ограничение и предложи совместимый путь или RFC."
  - "Если не уверен в имени заголовка/метода — НЕ ГАДАЙ: прочитай KafkaRpcConstants / KafkaRpcGenerator."
  - "Баги коммитов/стримов/конструктора канала — blocker; сначала воспроизведение тестом, потом фикс."
  - "При дефиците данных по интеграционному багу — уточнить топики, group.id, consumer-count, число партиций (topology docs), не крутить acks наугад."
  - "Изменение публичного API runtime — оценить SemVer и обновить domain_knowledge + code_anchors."

