      specs:
        - "kafka-rpc-runtime/src/test/java/ru/sbrf/uamc/kafkarpc/KafkaRpcConstantsTest.java"
    - domain: "server / unary / commits / dispatch"
      specs:
        - "kafka-rpc-runtime/src/test/java/ru/sbrf/uamc/kafkarpc/KafkaRpcServerTest.java"
    - domain: "pooled channel / group.id / request"
      specs:
        - "kafka-rpc-runtime/src/test/java/ru/sbrf/uamc/kafkarpc/PooledKafkaRpcChannelTest.java"
        - "kafka-rpc-runtime/src/test/java/ru/sbrf/uamc/kafkarpc/PooledKafkaRpcChannelGroupIdTest.java"
    - domain: "streaming call / sink"
      specs:
        - "kafka-rpc-runtime/src/test/java/ru/sbrf/uamc/kafkarpc/StreamingCallImplTest.java"
        - "kafka-rpc-runtime/src/test/java/ru/sbrf/uamc/kafkarpc/StreamSinkImplTest.java"
    - domain: "codegen"
      specs:
        - "kafka-rpc-protoc/src/test/java/ru/sbrf/uamc/kafkarpc/protoc/KafkaRpcGeneratorTest.java"
    - domain: "spring properties / pool / server auto-config"
