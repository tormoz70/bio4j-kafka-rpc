  channel_api: "kafka-rpc-runtime/src/main/java/ru/sbrf/uamc/kafkarpc/KafkaRpcChannel.java"
  pooled_channel: "kafka-rpc-runtime/src/main/java/ru/sbrf/uamc/kafkarpc/PooledKafkaRpcChannel.java"
  server: "kafka-rpc-runtime/src/main/java/ru/sbrf/uamc/kafkarpc/KafkaRpcServer.java"
  service_marker: "kafka-rpc-runtime/src/main/java/ru/sbrf/uamc/kafkarpc/KafkaRpcService.java"
  stream_sink: "kafka-rpc-runtime/src/main/java/ru/sbrf/uamc/kafkarpc/StreamSink.java"
